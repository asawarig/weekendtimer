<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q4 Budget Tracker – FINAL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 30'%3E%3Cpath fill='%230f9d58' d='M15 0H3a3 3 0 0 0-3 3v24a3 3 0 0 0 3 3h18a3 3 0 0 0 3-3V9z'/%3E%3Cpath fill='%2387ceac' d='M15 0v9h9z'/%3E%3Cpath fill='%23fff' d='M5 13h14v10H5zm2 2v2h4v-2zm6 0v2h4v-2zm-6 4v2h4v-2zm6 0v2h4v-2z'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: #f9fbfd;
    color: #1f1f1f;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
  }

  /* ---------- Top bar ---------- */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px 0; }
  .file-icon { width: 28px; height: 36px; flex: none; }
  .title-block { flex: 1; min-width: 0; }
  .title-row { display: flex; align-items: center; gap: 8px; }
  .file-title {
    font-size: 18px; padding: 2px 6px; border: 1px solid transparent; border-radius: 4px;
    outline: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .file-title:hover, .file-title:focus { border-color: #747775; }
  .star { color: #444746; font-size: 16px; }
  .menus { display: flex; gap: 2px; flex-wrap: wrap; }
  .menus span { padding: 2px 7px; border-radius: 4px; cursor: default; }
  .menus span:hover { background: #e8eaed; }
  .last-edit { color: #444746; text-decoration: underline; white-space: nowrap; }
  .right-actions { display: flex; align-items: center; gap: 12px; }
  .share {
    background: #c2e7ff; color: #001d35; border: 0; border-radius: 18px;
    padding: 9px 18px; font-weight: bold; font-size: 14px; cursor: pointer;
  }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: #7b61ff; color: #fff;
    display: grid; place-items: center; font-weight: bold;
  }

  /* ---------- Toolbar ---------- */
  .toolbar {
    margin: 8px 16px 6px; background: #edf2fa; border-radius: 24px; padding: 6px 14px;
    display: flex; align-items: center; gap: 4px; overflow-x: auto; white-space: nowrap; color: #444746;
  }
  .toolbar span { padding: 3px 7px; border-radius: 4px; cursor: default; }
  .toolbar span:hover { background: #dde3ea; }
  .toolbar .sep { width: 1px; height: 20px; background: #c7c7c7; padding: 0; margin: 0 4px; }

  /* ---------- Formula bar ---------- */
  .formula-bar {
    display: flex; align-items: center; border-top: 1px solid #e1e3e1; border-bottom: 1px solid #e1e3e1;
    background: #fff; height: 30px;
  }
  .name-box {
    width: 90px; padding: 0 10px; border-right: 1px solid #e1e3e1; height: 100%;
    display: flex; align-items: center; color: #1f1f1f;
  }
  .fx { padding: 0 10px; color: #80868b; font-style: italic; font-family: Georgia, serif; border-right: 1px solid #e1e3e1; }
  .formula { padding: 0 10px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }

  /* ---------- Grid ---------- */
  .grid-wrap { flex: 1; overflow: auto; background: #fff; }
  table.grid { border-collapse: collapse; table-layout: fixed; font-size: 13px; }
  .grid th, .grid td {
    border: 1px solid #e1e3e1; height: 23px; padding: 0 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .grid thead th {
    position: sticky; top: 0; z-index: 2; background: #f8f9fa; color: #444746;
    font-weight: normal; font-size: 11px; text-align: center;
  }
  .grid tbody th {
    position: sticky; left: 0; z-index: 1; background: #f8f9fa; color: #444746;
    font-weight: normal; font-size: 11px; text-align: center; width: 46px;
  }
  .grid thead th.corner { left: 0; z-index: 3; }
  .grid td { cursor: cell; outline: none; }
  .grid td.sel { box-shadow: inset 0 0 0 2px #1a73e8; }
  .grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .grid td.b { font-weight: bold; }
  .grid td.hdr { background: #d9ead3; font-weight: bold; }
  .grid td.title { font-size: 16px; font-weight: bold; }
  .grid td.muted { color: #5f6368; }
  .grid td.hl { background: #fff2cc; }
  .grid td.total { border-top: 2px solid #1f1f1f; font-weight: bold; }
  .bar { height: 10px; background: #e6e6e6; border-radius: 2px; overflow: hidden; }
  .bar > div { height: 100%; background: #34a853; width: 0; }

  /* ---------- Sheet tabs ---------- */
  .tabs {
    display: flex; align-items: center; gap: 4px; padding: 4px 12px; background: #f9fbfd;
    border-top: 1px solid #e1e3e1; overflow-x: auto; white-space: nowrap; color: #444746;
  }
  .tabs .tab { padding: 6px 14px; border-radius: 4px 4px 0 0; cursor: pointer; }
  .tabs .tab.active { background: #e1e9f7; color: #0b57d0; font-weight: bold; }
  .tabs .add { font-size: 18px; padding: 0 8px; }

  @media (max-width: 760px) {
    .menus, .toolbar { display: none; }
    .share { padding: 8px 12px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <svg class="file-icon" viewBox="0 0 24 30" aria-hidden="true">
    <path fill="#0f9d58" d="M15 0H3a3 3 0 0 0-3 3v24a3 3 0 0 0 3 3h18a3 3 0 0 0 3-3V9z"/>
    <path fill="#87ceac" d="M15 0v9h9z"/>
    <path fill="#fff" d="M5 13h14v10H5zm2 2v2h4v-2zm6 0v2h4v-2zm-6 4v2h4v-2zm6 0v2h4v-2z"/>
  </svg>
  <div class="title-block">
    <div class="title-row">
      <div class="file-title" contenteditable="true" spellcheck="false">Q4 Budget Tracker – FINAL</div>
      <span class="star">☆</span>
    </div>
    <nav class="menus">
      <span>File</span><span>Edit</span><span>View</span><span>Insert</span><span>Format</span><span>Data</span><span>Tools</span><span>Extensions</span><span>Help</span>
      <span class="last-edit" id="lastEdit">Last edit was seconds ago</span>
    </nav>
  </div>
  <div class="right-actions">
    <button class="share" type="button">🔒 Share</button>
    <div class="avatar">A</div>
  </div>
</header>

<div class="toolbar" aria-hidden="true">
  <span>↶</span><span>↷</span><span>🖶</span><span class="sep"></span>
  <span>100% ▾</span><span class="sep"></span>
  <span>$</span><span>%</span><span>.0</span><span>.00</span><span>123 ▾</span><span class="sep"></span>
  <span>Arial ▾</span><span class="sep"></span>
  <span>− 10 +</span><span class="sep"></span>
  <span><b>B</b></span><span><i>I</i></span><span><s>S</s></span><span>A</span><span class="sep"></span>
  <span>⊞</span><span>≡</span><span>🔗</span><span>💬</span><span>📊</span><span>Σ</span>
</div>

<div class="formula-bar">
  <div class="name-box" id="nameBox">A1</div>
  <div class="fx">fx</div>
  <div class="formula" id="formula"></div>
</div>

<div class="grid-wrap">
  <table class="grid" id="grid"></table>
</div>

<nav class="tabs">
  <span class="add">+</span><span>☰</span>
  <span class="tab">Summary</span>
  <span class="tab active">Q4 Tracker</span>
  <span class="tab">Headcount</span>
  <span class="tab">Archive</span>
</nav>

<script>
  // ---------- Layout ----------
  const COLS = 14, ROWS = 40;
  const WIDTHS = [190, 110, 90, 90, 90, 90, 120, 100, 100, 100, 100, 100, 100, 100];
  const letter = i => String.fromCharCode(65 + i);

  // Static cells: "A1": [value, classes, formula?]
  const cells = {
    A1: ['Q4 Budget & Delivery Tracker', 'title'],
    A2: ['Owner: Me · Last reviewed: this week', 'muted'],

    A4: ['Workstream', 'hdr'], B4: ['Owner', 'hdr'], C4: ['Budget', 'hdr num'],
    D4: ['Spent', 'hdr num'], E4: ['Variance', 'hdr num'], F4: ['Status', 'hdr'],
    A5: ['Stakeholder alignment'], B5: ['Product'], C5: ['12,000', 'num'], D5: ['11,450', 'num'], E5: ['550', 'num', '=C5-D5'], F5: ['Complete'],
    A6: ['Resource planning'], B6: ['Ops'], C6: ['8,500', 'num'], D6: ['8,900', 'num'], E6: ['(400)', 'num', '=C6-D6'], F6: ['Complete'],
    A7: ['Vendor onboarding'], B7: ['Finance'], C7: ['15,000', 'num'], D7: ['9,200', 'num'], E7: ['5,800', 'num', '=C7-D7'], F7: ['In progress'],
    A8: ['QA & testing'], B8: ['Eng'], C8: ['10,000', 'num'], D8: ['4,100', 'num'], E8: ['5,900', 'num', '=C8-D8'], F8: ['In progress'],
    A9: ['Total', 'total'], B9: ['', 'total'], C9: ['45,500', 'num total', '=SUM(C5:C8)'],
    D9: ['33,650', 'num total', '=SUM(D5:D8)'], E9: ['11,850', 'num total', '=SUM(E5:E8)'], F9: ['', 'total'],

    A12: ['Milestone timeline', 'b'],
    A13: ['Milestone', 'hdr'], B13: ['Due', 'hdr'], C13: ['Days', 'hdr num'], D13: ['Hours', 'hdr num'],
    E13: ['Minutes', 'hdr num'], F13: ['Seconds', 'hdr num'], G13: ['% complete', 'hdr num'], H13: ['', 'hdr'],
    A14: ['Phase 1 review'], B14: ['Done'], C14: ['0', 'num'], D14: ['0', 'num'], E14: ['0', 'num'], F14: ['0', 'num'], G14: ['100.0%', 'num'],
    A15: ['Phase 2 sign-off', 'hl'], B15: ['Fri 18:00', 'hl'],
    C15: ['', 'num hl', '=INT(B15-NOW())'], D15: ['', 'num hl', '=HOUR(B15-NOW())'],
    E15: ['', 'num hl', '=MINUTE(B15-NOW())'], F15: ['', 'num hl', '=SECOND(B15-NOW())'],
    G15: ['', 'num hl', '=(NOW()-B16)/(B15-B16)'], H15: ['', 'hl'],
    A16: ['Phase 3 kickoff'], B16: ['Mon 09:00'], C16: ['TBD', 'num muted'], G16: ['0.0%', 'num'],

    A19: ['Notes', 'b'],
    A20: ['Variance in brackets = overspend. Update the timeline before Friday.', 'muted'],
  };

  // ---------- Build grid ----------
  const grid = document.getElementById('grid');
  let html = '<colgroup><col style="width:46px">' + WIDTHS.map(w => `<col style="width:${w}px">`).join('') + '</colgroup>';
  html += '<thead><tr><th class="corner"></th>' + WIDTHS.map((_, i) => `<th>${letter(i)}</th>`).join('') + '</tr></thead><tbody>';
  for (let r = 1; r <= ROWS; r++) {
    html += `<tr><th>${r}</th>`;
    for (let c = 0; c < COLS; c++) {
      const id = letter(c) + r;
      const [val = '', cls = ''] = cells[id] || [];
      html += `<td id="${id}" class="${cls}">${val}</td>`;
    }
    html += '</tr>';
  }
  grid.innerHTML = html + '</tbody>';

  const $ = id => document.getElementById(id);
  $('H15').innerHTML = '<div class="bar"><div id="progress"></div></div>';

  // ---------- Selection, formula bar, editing ----------
  let selected = null;
  function select(td) {
    if (selected) { selected.classList.remove('sel'); selected.contentEditable = 'false'; }
    selected = td;
    td.classList.add('sel');
    $('nameBox').textContent = td.id;
    const f = cells[td.id] && cells[td.id][2];
    $('formula').textContent = f || td.textContent;
  }
  grid.addEventListener('click', e => {
    const td = e.target.closest('td');
    if (td) select(td);
  });
  grid.addEventListener('dblclick', e => {
    const td = e.target.closest('td');
    if (!td || cells[td.id]?.[2]) return; // formula cells stay read-only
    td.contentEditable = 'true';
    td.focus();
  });
  grid.addEventListener('input', e => {
    if (e.target === selected) $('formula').textContent = selected.textContent;
  });
  document.addEventListener('keydown', e => {
    if (!selected || selected.isContentEditable && e.key !== 'Enter') return;
    const col = selected.id.charCodeAt(0) - 65, row = +selected.id.slice(1);
    const moves = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], Enter: [0, 1], Tab: [1, 0] };
    const m = moves[e.key];
    if (!m) return;
    e.preventDefault();
    const c = Math.min(COLS - 1, Math.max(0, col + m[0])), r = Math.min(ROWS, Math.max(1, row + m[1]));
    select($(letter(c) + r));
  });
  select($('A1'));

  // ---------- Weekend countdown ----------
  // Weekend starts Friday 18:00 and ends Monday 09:00 (visitor's local time).
  const START_DAY = 5, START_HOUR = 18, END_DAY = 1, END_HOUR = 9;

  function lastAt(now, day, hour) {
    const d = new Date(now);
    d.setHours(hour, 0, 0, 0);
    d.setDate(d.getDate() - ((d.getDay() - day + 7) % 7));
    if (d > now) d.setDate(d.getDate() - 7);
    return d;
  }
  function nextAt(now, day, hour) {
    const d = lastAt(now, day, hour);
    d.setDate(d.getDate() + 7);
    return d;
  }

  function tick() {
    const now = new Date();
    const inWeekend = lastAt(now, START_DAY, START_HOUR) > lastAt(now, END_DAY, END_HOUR);
    const lastEnd = lastAt(now, END_DAY, END_HOUR);
    const target = inWeekend ? nextAt(now, END_DAY, END_HOUR) : nextAt(now, START_DAY, START_HOUR);
    const s = Math.max(0, Math.floor((target - now) / 1000));

    $('A15').textContent = inWeekend ? 'Out of office' : 'Phase 2 sign-off';
    $('B15').textContent = inWeekend ? 'Mon 09:00' : 'Fri 18:00';
    $('C15').textContent = Math.floor(s / 86400);
    $('D15').textContent = Math.floor(s % 86400 / 3600);
    $('E15').textContent = Math.floor(s % 3600 / 60);
    $('F15').textContent = s % 60;

    const pct = inWeekend ? 100 : Math.min(100, (now - lastEnd) / (target - lastEnd) * 100);
    $('G15').textContent = pct.toFixed(1) + '%';
    $('progress').style.width = pct + '%';

    if (selected && cells[selected.id]?.[2]) $('formula').textContent = cells[selected.id][2];
    $('lastEdit').textContent = 'Last edit was ' + (now.getSeconds() % 20 < 10 ? 'seconds ago' : '1 minute ago');
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
