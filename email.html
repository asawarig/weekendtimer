<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox (12) – Mail</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='4' width='20' height='16' rx='2' fill='%231a73e8'/%3E%3Cpath d='M3 6l9 7 9-7' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: #f6f8fc;
    color: #1f1f1f;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
  }

  /* ---------- Header ---------- */
  .header { display: flex; align-items: center; gap: 16px; padding: 8px 16px; height: 64px; }
  .burger { font-size: 20px; color: #444746; padding: 8px; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 22px; color: #444746; width: 170px; }
  .brand svg { width: 32px; height: 32px; }
  .search {
    flex: 1; max-width: 720px; display: flex; align-items: center; gap: 12px;
    background: #e9eef6; border-radius: 24px; padding: 0 16px; height: 46px; color: #444746;
  }
  .search input { flex: 1; border: 0; background: transparent; font-size: 16px; outline: none; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 16px; color: #444746; font-size: 18px; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: #7b61ff; color: #fff;
    display: grid; place-items: center; font-weight: bold; font-size: 14px;
  }

  /* ---------- Body layout ---------- */
  .main { flex: 1; display: flex; min-height: 0; }
  .sidebar { width: 256px; padding: 8px 16px 0 8px; flex: none; }
  .compose {
    display: inline-flex; align-items: center; gap: 12px; background: #c2e7ff; color: #001d35;
    border: 0; border-radius: 16px; padding: 18px 24px 18px 20px; font-size: 14px; font-weight: bold;
    cursor: pointer; margin-bottom: 16px;
  }
  .folder {
    display: flex; justify-content: space-between; padding: 6px 12px 6px 26px; border-radius: 0 16px 16px 0;
    color: #1f1f1f; cursor: pointer;
  }
  .folder:hover { background: #eaebef; }
  .folder.active { background: #d3e3fd; font-weight: bold; color: #001d35; }
  .folder .count { font-size: 12px; font-variant-numeric: tabular-nums; }
  .labels-title { margin: 18px 0 6px 26px; font-size: 15px; color: #1f1f1f; }

  .panel { flex: 1; display: flex; background: #fff; border-radius: 16px; margin: 0 16px 16px 0; min-width: 0; overflow: hidden; }

  /* ---------- Inbox list ---------- */
  .list { width: 420px; flex: none; border-right: 1px solid #eceff1; overflow-y: auto; }
  .list-toolbar { display: flex; align-items: center; gap: 18px; padding: 12px 16px; color: #444746; border-bottom: 1px solid #eceff1; }
  .list-toolbar .range { margin-left: auto; font-size: 12px; }
  .msg { padding: 10px 16px; border-bottom: 1px solid #f1f3f4; cursor: pointer; }
  .msg:hover { box-shadow: inset 1px 0 #dadce0, inset -1px 0 #dadce0, 0 1px 2px rgba(60,64,67,.3); }
  .msg.unread { background: #fff; font-weight: bold; }
  .msg.read { background: #f2f6fc; }
  .msg.active { background: #c2dbff; }
  .msg .row1 { display: flex; justify-content: space-between; gap: 8px; }
  .msg .from, .msg .subj, .msg .snip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg .time { font-size: 12px; flex: none; }
  .msg .snip { color: #5f6368; font-weight: normal; }

  /* ---------- Reading pane ---------- */
  .reader { flex: 1; overflow-y: auto; padding: 20px 28px 40px; min-width: 0; }
  .back { display: none; color: #444746; margin-bottom: 10px; cursor: pointer; }
  .reader h1 { font-size: 22px; font-weight: normal; margin: 0 0 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tag { font-size: 12px; background: #ddd; color: #444; padding: 2px 6px; border-radius: 4px; }
  .sender { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 18px; }
  .sender .pic { width: 40px; height: 40px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-weight: bold; flex: none; }
  .sender .who { flex: 1; min-width: 0; }
  .sender .who b { font-size: 14px; }
  .sender .who .addr, .sender .who .to { color: #5f6368; font-size: 12px; }
  .sender .when { color: #5f6368; font-size: 12px; white-space: nowrap; }
  .body { line-height: 1.55; max-width: 680px; }
  .body p { margin: 0 0 12px; }

  .invite { border: 1px solid #dadce0; border-radius: 8px; padding: 16px; margin: 16px 0; max-width: 520px; }
  .invite .head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .invite .date { width: 52px; text-align: center; border: 1px solid #dadce0; border-radius: 6px; overflow: hidden; flex: none; }
  .invite .date .m { background: #d93025; color: #fff; font-size: 11px; padding: 2px 0; font-weight: bold; }
  .invite .date .d { font-size: 20px; padding: 4px 0; }
  .invite .title { font-weight: bold; font-size: 15px; }
  .invite .meta { color: #5f6368; font-size: 13px; }
  .invite .starts { font-size: 13px; color: #1f1f1f; margin: 6px 0 12px; }
  .invite .starts b { font-variant-numeric: tabular-nums; }
  .rsvp { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .rsvp span { color: #5f6368; font-size: 13px; margin-right: 4px; }
  .rsvp button { border: 1px solid #747775; background: #fff; border-radius: 16px; padding: 6px 16px; cursor: pointer; font-size: 13px; }
  .rsvp button.on { background: #d3e3fd; border-color: #d3e3fd; font-weight: bold; }

  .reply-box { margin-top: 24px; border: 1px solid #dadce0; border-radius: 16px; padding: 14px 16px; max-width: 680px; }
  .reply-box .to { color: #5f6368; font-size: 13px; margin-bottom: 8px; }
  .reply-box .text { min-height: 80px; outline: none; line-height: 1.5; }
  .reply-box .text:empty::before { content: 'Write a reply…'; color: #9aa0a6; }
  .reply-actions { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .send { background: #0b57d0; color: #fff; border: 0; border-radius: 18px; padding: 9px 22px; font-weight: bold; cursor: pointer; }
  .reply-status { color: #5f6368; font-size: 13px; }

  @media (max-width: 1000px) {
    .sidebar, .brand span { display: none; }
    .brand { width: auto; }
    .panel { margin-left: 16px; }
  }
  @media (max-width: 760px) {
    .header { gap: 8px; padding: 8px; }
    .burger { display: none; }
    .header-right .icon { display: none; }
    .panel { margin: 0; border-radius: 0; }
    .list { width: 100%; border-right: 0; }
    .reader { display: none; padding: 16px; }
    body.reading .list { display: none; }
    body.reading .reader { display: block; }
    .back { display: block; }
  }
</style>
</head>
<body>

<header class="header">
  <span class="burger">☰</span>
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="2" y="4" width="20" height="16" rx="2" fill="#1a73e8"/>
      <path d="M3 6l9 7 9-7" fill="none" stroke="#fff" stroke-width="2"/>
    </svg>
    <span>Mail</span>
  </div>
  <label class="search">🔍 <input type="text" placeholder="Search mail"></label>
  <div class="header-right">
    <span class="icon">?</span><span class="icon">⚙</span><span class="icon">⋮⋮⋮</span>
    <div class="avatar">A</div>
  </div>
</header>

<div class="main">
  <aside class="sidebar">
    <button class="compose" type="button">✏️ Compose</button>
    <div class="folder active"><span>📥 Inbox</span><span class="count">12</span></div>
    <div class="folder"><span>☆ Starred</span></div>
    <div class="folder"><span>🕒 Snoozed</span></div>
    <div class="folder"><span>➤ Sent</span></div>
    <div class="folder"><span>📄 Drafts</span><span class="count">3</span></div>
    <div class="folder"><span>⌄ More</span></div>
    <div class="labels-title">Labels</div>
    <div class="folder"><span>🏷 Finance</span></div>
    <div class="folder"><span>🏷 Projects</span></div>
    <div class="folder"><span>🏷 Q4</span></div>
  </aside>

  <section class="panel">
    <div class="list" id="list">
      <div class="list-toolbar">☐ ⌄ <span>↻</span> <span>⋮</span><span class="range">1–50 of 2,184</span></div>
    </div>
    <article class="reader" id="reader"></article>
  </section>
</div>

<script>
  // ---------- Weekend countdown ----------
  // Weekend starts Friday 18:00 and ends Monday 09:00 (visitor's local time).
  const START_DAY = 5, START_HOUR = 18, END_DAY = 1, END_HOUR = 9;

  function lastAt(now, day, hour) {
    const d = new Date(now);
    d.setHours(hour, 0, 0, 0);
    d.setDate(d.getDate() - ((d.getDay() - day + 7) % 7));
    if (d > now) d.setDate(d.getDate() - 7);
    return d;
  }
  function nextAt(now, day, hour) {
    const d = lastAt(now, day, hour);
    d.setDate(d.getDate() + 7);
    return d;
  }
  function fmt(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
          m = Math.floor(s % 3600 / 60), sec = s % 60;
    const pad = n => String(n).padStart(2, '0');
    return (d ? d + 'd ' : '') + pad(h) + 'h ' + pad(m) + 'm ' + pad(sec) + 's';
  }
  function weekendState(now = new Date()) {
    const inWeekend = lastAt(now, START_DAY, START_HOUR) > lastAt(now, END_DAY, END_HOUR);
    const target = inWeekend ? nextAt(now, END_DAY, END_HOUR) : nextAt(now, START_DAY, START_HOUR);
    return { inWeekend, target, left: target - now };
  }

  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  // ---------- Messages ----------
  const messages = [
    {
      id: 'invite', unread: true, from: 'Calendar', color: '#1a73e8', addr: 'calendar-notification@mail.example',
      time: 'Now',
      subject: () => weekendState().inWeekend
        ? 'Out of office: Back Mon 09:00'
        : 'Invitation: Phase 2 sign-off @ Fri 18:00',
      snippet: () => weekendState().inWeekend
        ? 'Auto-reply is on. Ends in ' + fmt(weekendState().left)
        : 'Starts in ' + fmt(weekendState().left) + ' · Organizer: You',
      body: () => {
        const { inWeekend, target } = weekendState();
        return `
          <div class="invite">
            <div class="head">
              <div class="date"><div class="m">${MONTHS[target.getMonth()]}</div><div class="d">${target.getDate()}</div></div>
              <div>
                <div class="title">${inWeekend ? 'Out of office' : 'Phase 2 sign-off'}</div>
                <div class="meta">${DAYS[target.getDay()]} · ${inWeekend ? 'until 09:00' : '18:00 – 23:59'} · Organizer: You</div>
              </div>
            </div>
            <div class="starts">${inWeekend ? 'Ends in' : 'Starts in'} <b id="liveCountdown">${fmt(weekendState().left)}</b></div>
            <div class="rsvp"><span>Going?</span>
              <button type="button" class="on">Yes</button><button type="button">Maybe</button><button type="button">No</button>
            </div>
          </div>
          <p>${inWeekend
            ? 'Thanks for your email. I am currently out of the office with limited access to email and will respond when I return on Monday.'
            : 'Hi team,<br><br>Please hold this slot for the Phase 2 sign-off. Attendance is mandatory. Agenda to follow.'}</p>
          <p>Best regards</p>`;
      },
    },
    {
      from: 'Finance Ops', color: '#e37400', addr: 'finance-ops@mail.example', time: '10:42',
      subject: 'RE: Q4 budget reconciliation – action needed',
      snippet: 'Hi, following up on the variance in row 6. Could you confirm the vendor numbers by EOD?',
      body: `<p>Hi,</p><p>Following up on the variance in row 6 of the tracker. Could you confirm the vendor numbers by EOD so we can close the month?</p><p>The updated template is on the shared drive under Finance › Q4.</p><p>Thanks,<br>Finance Ops</p>`,
    },
    {
      from: 'Priya (Product)', color: '#188038', addr: 'priya@mail.example', time: '09:15',
      subject: 'Stakeholder deck – final comments',
      snippet: 'Left a few comments on slides 4–7. Mostly wording. Can we sync for 15 min before the review?',
      body: `<p>Hey,</p><p>Left a few comments on slides 4–7, mostly wording. Can we sync for 15 minutes before the review?</p><p>Also, can we move the timeline slide earlier? Leadership will ask about dates first.</p><p>Priya</p>`,
    },
    {
      from: 'IT Helpdesk', color: '#5f6368', addr: 'helpdesk@mail.example', time: 'Yesterday',
      subject: '[Ticket #48213] Password expiry reminder',
      snippet: 'Your password will expire in 5 days. Please update it via the self-service portal.',
      body: `<p>Hello,</p><p>Your password will expire in 5 days. Please update it via the self-service portal to avoid losing access.</p><p>This is an automated message. Please do not reply.</p>`,
    },
    {
      from: 'Rahul, Meera, +3', color: '#a142f4', addr: 'project-team@mail.example', time: 'Yesterday',
      subject: 'Weekly sync notes + action items',
      snippet: 'Notes from today: 1) QA timeline moved by 2 days 2) Vendor onboarding at 60%...',
      body: `<p>Hi all,</p><p>Notes from today's sync:</p><p>1) QA timeline moved by 2 days.<br>2) Vendor onboarding is at 60%.<br>3) Owners to update the tracker before Friday.</p><p>Thanks,<br>Rahul</p>`,
    },
    {
      from: 'HR Team', color: '#d93025', addr: 'hr@mail.example', time: 'Mon',
      subject: 'Reminder: complete your annual compliance training',
      snippet: 'This is a friendly reminder that the annual compliance modules are due at the end of the month.',
      body: `<p>Hi,</p><p>This is a friendly reminder that the annual compliance modules are due at the end of the month. It takes about 45 minutes.</p><p>HR Team</p>`,
    },
    {
      from: 'Vendor Support', color: '#0b8043', addr: 'support@vendor.example', time: 'Mon',
      subject: 'Your invoice #INV-2291 is ready',
      snippet: 'Thank you for your business. Your invoice for this billing period is attached.',
      body: `<p>Hello,</p><p>Thank you for your business. Your invoice for this billing period is attached.</p><p>Vendor Support</p>`,
    },
  ];

  const val = v => typeof v === 'function' ? v() : v;
  const list = document.getElementById('list');
  const reader = document.getElementById('reader');
  let openId = 0;

  function renderList() {
    list.querySelectorAll('.msg').forEach(n => n.remove());
    messages.forEach((m, i) => {
      const el = document.createElement('div');
      el.className = 'msg ' + (m.unread ? 'unread' : 'read') + (i === openId ? ' active' : '');
      el.dataset.i = i;
      el.innerHTML = `
        <div class="row1"><span class="from">${m.from}</span><span class="time">${m.time}</span></div>
        <div class="subj">${val(m.subject)}</div>
        <div class="snip" ${i === 0 ? 'id="liveSnippet"' : ''}>${val(m.snippet)}</div>`;
      list.appendChild(el);
    });
  }

  function renderReader() {
    const m = messages[openId];
    reader.innerHTML = `
      <div class="back" id="back">← Back to Inbox</div>
      <h1>${val(m.subject)} <span class="tag">Inbox</span></h1>
      <div class="sender">
        <div class="pic" style="background:${m.color}">${m.from[0]}</div>
        <div class="who"><b>${m.from}</b> <span class="addr">&lt;${m.addr}&gt;</span><div class="to">to me ▾</div></div>
        <div class="when">${m.time === 'Now' ? 'just now' : m.time}</div>
      </div>
      <div class="body">${val(m.body)}</div>
      <div class="reply-box">
        <div class="to">↩ ${m.from}</div>
        <div class="text" contenteditable="true"></div>
        <div class="reply-actions"><button class="send" type="button">Send</button><span class="reply-status"></span></div>
      </div>`;
  }

  function open(i) {
    openId = i;
    messages[i].unread = false;
    renderList();
    renderReader();
    document.body.classList.add('reading');
  }

  list.addEventListener('click', e => {
    const el = e.target.closest('.msg');
    if (el) open(+el.dataset.i);
  });
  reader.addEventListener('click', e => {
    if (e.target.id === 'back') document.body.classList.remove('reading');
    if (e.target.matches('.rsvp button')) {
      reader.querySelectorAll('.rsvp button').forEach(b => b.classList.toggle('on', b === e.target));
    }
    if (e.target.matches('.send')) {
      const text = reader.querySelector('.reply-box .text');
      const status = reader.querySelector('.reply-status');
      if (!text.textContent.trim()) { status.textContent = 'Write something first.'; return; }
      text.textContent = '';
      status.textContent = 'Message sent.';
      setTimeout(() => status.textContent = '', 2500);
    }
  });

  // ---------- Live updates ----------
  let wasWeekend = weekendState().inWeekend;
  function tick() {
    const st = weekendState();
    if (st.inWeekend !== wasWeekend) {
      // Weekend started or ended: redraw everything.
      wasWeekend = st.inWeekend;
      renderList();
      if (openId === 0) renderReader();
    }
    const snip = document.getElementById('liveSnippet');
    if (snip) snip.textContent = val(messages[0].snippet);
    const cd = document.getElementById('liveCountdown');
    if (cd) cd.textContent = fmt(st.left);
  }

  messages[0].unread = true;
  renderList();
  renderReader();
  setInterval(tick, 1000);
</script>
</body>
</html>
